<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testy – Právo</title>
<style>
:root{--bg:#1A1A1A;--surface:#2A2A2A;--border:#404040;--text:#E8E8E8;--muted:#A0A0A0;--primary:#4DB6AC;--ok:#66BB6A;--ok-bg:#1B3A1B;--bad:#EF5350;--bad-bg:#3A1B1B;--miss:#FFA726;--miss-bg:#3A2E1B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px 14px}
button:hover{border-color:var(--primary)}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}
.mode{text-align:left}
.mode b{display:block;font-weight:600}
.mode span{font-size:13px;color:var(--muted)}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.timer{font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bar{height:6px;background:#3A3A3A;border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.q{font-size:18px;font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}
.opt .box{flex:0 0 22px;height:22px;border:2px solid var(--border);border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:600}
.opt.sel{border-color:var(--primary);background:#2A3A3A}
.opt.sel .box{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.miss{border-color:var(--miss);background:var(--miss-bg);border-style:dashed}
.fb{border-radius:10px;padding:12px;margin:8px 0 14px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.score{font-size:48px;font-weight:600;margin:6px 0}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.rev{border-top:1px solid var(--border);padding:10px 0}
.hidden{display:none}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;margin-bottom:32px">
    <h1 style="font-size:32px;margin:0 0 8px;background:linear-gradient(135deg,#4DB6AC,#66BB6A);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Testy – Právo</h1>
    <p class="sub" style="font-size:15px">Vyber predmet a začni sa učiť</p>
  </div>

  <section id="subject" class="card">
    <div class="label">Vyber predmet</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0">
      <button id="subjSpravne" class="btn-p" style="padding:20px;font-size:18px;font-weight:600">Správne právo</button>
      <button id="subjObcianske" style="padding:20px;font-size:18px;font-weight:600">Občianske právo</button>
    </div>
  </section>

  <section id="start" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="label">Režim</div>
      <button id="backToSubject" style="padding:6px 12px;font-size:14px">← Späť</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px">
      <button id="mExam">Ako na skúške – výsledok až na konci</button>
      <button id="mLearn" class="btn-p">Učenie – správna odpoveď hneď</button>
    </div>
    <div id="modes"></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top">
      <div>
        <span class="label" id="testNum">Test</span>
        <span class="label" id="pos">Otázka 1</span>
      </div>
      <span class="timer" id="timer">10:00</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <p class="q" id="qtext"></p>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="row">
      <button id="quit">Ukončiť</button>
      <button id="next" class="btn-p" disabled>Potvrdiť</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="label" id="rtitle"></div>
    <div class="score" id="rscore"></div>
    <p id="rverdict"></p>
    <div class="row" style="margin:14px 0">
      <button id="again" class="btn-p">Nový test</button>
      <button id="retry">Zopakovať chybné</button>
    </div>
    <div id="review"></div>
  </section>
</div>

<script>
const SCHOOL_QUESTIONS = [{"q": "Obec vydáva:", "o": ["všeobecne záväzné nariadenia", "vyhlášky", "nariadenia vlády", "uznesenia"], "c": [0], "w": "Obec vydáva všeobecne záväzné nariadenia."}, {"q": "Pre správne právo je charakteristické:", "o": ["je nekodifikovaným právnym odvetvím a patrí do verejného práva", "je kodifikovaným právnym odvetvím", "patrí do súkromného práva", "upravuje iba súkromné vzťahy"], "c": [0], "w": "Je nekodifikovaným právnym odvetvím a patrí do verejného práva."}, {"q": "Spôsobilosť fyzickej osoby na právne úkony vzniká:", "o": ["dovŕšením 18. roku, ak norma správneho práva neustanovuje inú vekovú hranicu", "narodením", "dovŕšením 15. roku", "registráciou"], "c": [0], "w": "Dovŕšením 18. roku, ak osobitná norma neustanovuje inak."}, {"q": "Zložkou verejnej správy je:", "o": ["štátna správa a samospráva", "súdnictvo", "zákonodarná moc", "iba štátna správa"], "c": [0], "w": "Štátna správa a samospráva."}, {"q": "Princíp dekoncentrácie verejnej správy znamená:", "o": ["prenos úloh zo štátneho subjektu na iný štátny subjekt", "prenos úloh zo štátneho subjektu na neštátny subjekt", "centralizáciu moci", "zrušenie úloh"], "c": [0], "w": "Prenos úloh zo štátneho subjektu na iný štátny subjekt."}, {"q": "Hlavného kontrolóra obce volí a odvoláva:", "o": ["obecné zastupiteľstvo", "starosta obce", "obyvatelia obce", "okresný úrad"], "c": [0], "w": "Obecné zastupiteľstvo."}, {"q": "Spôsobilosť fyzickej osoby na práva a povinnosti vzniká:", "o": ["narodením", "dovŕšením 18. roku", "sobášom", "registráciou"], "c": [0], "w": "Narodením."}, {"q": "Subsidiarita správneho poriadku znamená, že správny poriadok:", "o": ["sa použije, ak osobitný právny predpis neustanovuje inak", "sa použije vždy", "sa nepoužije vôbec", "platí len pre obce"], "c": [0], "w": "Sa použije, ak osobitný právny predpis neustanovuje inak."}, {"q": "Starostu obce volí:", "o": ["obyvatelia obce", "obecné zastupiteľstvo", "vláda SR", "predseda VÚC"], "c": [0], "w": "Obyvatelia obce."}, {"q": "Všeobecné záväzné nariadenie obce nadobúda platnosť:", "o": ["dňom vyvesenia na úradnú tabuľu v obci", "dňom schválenia zastupiteľstvom", "dňom uverejnenia v Zbierke zákonov", "dňom podpisu starostom"], "c": [0], "w": "Dňom vyvesenia na úradnú tabuľu v obci."}, {"q": "Orgánom územnej samosprávy je:", "o": ["starosta obce a predseda vyššieho územného celku", "minister", "predseda vlády", "predseda okresného úradu"], "c": [0], "w": "Starosta obce a predseda VÚC."}, {"q": "Princíp decentralizácie verejnej správy znamená:", "o": ["prenos úloh zo štátneho subjektu na neštátny subjekt", "prenos úloh zo štátneho subjektu na iný štátny subjekt", "centralizáciu", "dekoncentráciu"], "c": [0], "w": "Prenos úloh zo štátneho subjektu na neštátny subjekt."}, {"q": "Štátna správa je:", "o": ["užší pojem ako verejná správa a je na rovnakej úrovni ako samospráva", "širší pojem ako verejná správa", "nie je súčasťou verejnej správy", "súčasťou súdnictva"], "c": [0], "w": "Je užší pojem ako verejná správa a je na rovnakej úrovni ako samospráva."}, {"q": "Prameňom správneho práva je:", "o": ["Ústava SR a právo EÚ", "iba zákony", "iba nariadenia vlády", "rozhodnutia okresných súdov"], "c": [0], "w": "Ústava SR a právo EÚ."}, {"q": "Účinnosť normy správneho práva znamená, že:", "o": ["norma je záväzná pre subjekty správneho práva a dodržiavanie normy je právne vynútiteľné", "norma bola len publikovaná", "norma ešte nenadobudla platnosť", "norma platí len pre orgány"], "c": [0], "w": "Norma je záväzná a jej dodržiavanie je právne vynútiteľné."}, {"q": "Princíp delegácie vo verejnej správe znamená:", "o": ["prenos úloh zo štátneho subjektu na neštátny subjekt, ktorý tieto úlohy bude plniť ako prenesený výkon štátnej správy", "prenos úloh medzi štátnymi orgánmi", "zrušenie pôsobnosti", "centralizáciu moci"], "c": [0], "w": "Prenos úloh na neštátny subjekt ako prenesený výkon štátnej správy."}, {"q": "Samospráva vznikla:", "o": ["decentralizáciou štátnej moci", "centralizáciou štátnej moci", "dekoncentráciou", "zákonodarnou činnosťou"], "c": [0], "w": "Decentralizáciou štátnej moci."}, {"q": "Medzi subjekty verejnej správy patria:", "o": ["štátne orgány, fyzické osoby a orgány samosprávy", "iba ministerstvá", "iba súdy", "iba vláda"], "c": [0], "w": "Štátne orgány, fyzické osoby a orgány samosprávy."}, {"q": "Pod priamou realizáciou normy správneho práva rozumieme:", "o": ["realizáciu normy v bežnom živote bez zásahu orgánu verejnej správy", "aplikáciu normy orgánom verejnej správy", "vydávanie právnych predpisov", "odvolanie proti rozhodnutiu"], "c": [0], "w": "Realizáciu normy v bežnom živote bez zásahu orgánu verejnej správy."}, {"q": "Vonkajšiu kontrolu vo verejnej správe vykonáva:", "o": ["súd, národná rada SR a verejný ochranca práv", "iba ministerstvo vnútra", "iba prokuratúra", "iba obec"], "c": [0], "w": "Súd, NR SR a verejný ochranca práv."}, {"q": "Osvedčenie je:", "o": ["materiálno-technický úkon", "normatívny správny akt", "individuálny správny akt", "rozsudok súdu"], "c": [0], "w": "Materiálno-technický úkon."}, {"q": "VZN obce schvaľuje:", "o": ["3/5 väčšina poslancov obecného zastupiteľstva", "nadpolovičná väčšina prítomných", "2/3 väčšina", "starosta sám"], "c": [0], "w": "3/5 väčšina poslancov."}, {"q": "Prokurátor môže v správnom konaní podať protest:", "o": ["do troch rokov od právoplatnosti rozhodnutia", "do jedného roka", "do piatich rokov", "bez časového obmedzenia"], "c": [0], "w": "Do troch rokov."}, {"q": "O kontrole sa vydá:", "o": ["protokol", "rozhodnutie", "uznesenie", "vyhláška"], "c": [0], "w": "Protokol."}, {"q": "Obnova konania je možná:", "o": ["ak sa objavia nové dôkazy", "ak uplynie lehota na odvolanie", "ak účastník zomrie", "ak sa podá rozklad"], "c": [0], "w": "Ak sa objavia nové dôkazy."}, {"q": "Miestne orgány štátnej správy sú:", "o": ["okresný úrad a krajský úrad", "obec a VÚC", "ministerstvo a úrad vlády", "iba okresný úrad"], "c": [0], "w": "Okresný úrad a krajský úrad."}, {"q": "Rozkazné konanie je:", "o": ["skrátená forma konania o priestupkoch", "bežné správne konanie", "odvolacie konanie", "súdne konanie"], "c": [0], "w": "Skrátená forma konania o priestupkoch."}, {"q": "Vykonateľnosť rozhodnutia je:", "o": ["možnosť núteného výkonu rozhodnutia", "platnosť rozhodnutia", "účinnosť rozhodnutia", "právoplatnosť rozhodnutia"], "c": [0], "w": "Možnosť núteného výkonu."}, {"q": "Uložiť pokutu v blokovom konaní možno:", "o": ["len ak je priestupok spoľahlivo zistený", "vždy", "iba so súhlasom účastníka", "iba súdom"], "c": [0], "w": "Len ak je priestupok spoľahlivo zistený."}, {"q": "Správne konanie je zastavené:", "o": ["ak navrhovateľ vzal návrh na jeho začatie späť", "ak uplynie 30 dní", "ak sa účastník nedostaví", "vždy po ústnom pojednávaní"], "c": [0], "w": "Ak navrhovateľ vzal návrh späť."}, {"q": "Správny delikt bez ohľadu na zavinenie môže spáchať:", "o": ["len právnická osoba", "len fyzická osoba", "iba úradník", "nikto"], "c": [0], "w": "Len právnická osoba."}, {"q": "Prednostu okresného úradu menuje:", "o": ["predseda vlády", "minister vnútra", "prezident SR", "starosta obce"], "c": [0], "w": "Predseda vlády."}, {"q": "Priestupku sa môže dopustiť:", "o": ["fyzická osoba", "právnická osoba", "iba úradník", "iba občan SR"], "c": [0], "w": "Fyzická osoba."}, {"q": "Fakultatívnym orgánom obce je:", "o": ["obecná rada", "obecné zastupiteľstvo", "starosta", "hlavný kontrolór"], "c": [0], "w": "Obecná rada."}, {"q": "Obec je:", "o": ["samosprávny územný celok", "orgán štátnej správy", "súkromná osoba", "ministerstvo"], "c": [0], "w": "Samosprávny územný celok."}, {"q": "Medzi zásady uplatňovania donucovacej moci v štátnej správe patrí:", "o": ["zásada proporcionality a zásada primeranosti", "zásada diskriminácie", "zásada neobmedzenosti", "zásada súkromnej žaloby"], "c": [0], "w": "Zásada proporcionality a primeranosti."}, {"q": "Medzi charakteristické črty štátnej správy patrí:", "o": ["nariaďovacia činnosť a vykonáva sa v mene štátu", "dobrovoľnosť", "samospr  "Odstúpenie od zmluvy je:", "o": ["jednostranný právny úkon rušiaci zmluvu", "dohoda o zrušení", "zmena zmluvy", "doplnenie zmluvy"], "c": [0], "w": "jednostranný právny úkon rušiaci zmluvu"}, {"q": "Výpoveď je:", "o": ["jednostranné ukončenie zmluvy", "dohoda", "zmena", "doplnenie"], "c": [0], "w": "jednostranné ukončenie zmluvy"}, {"q": "Dohoda o zrušení je:", "o": ["vzájomný súhlas o ukončení", "výpoveď", "odstúpenie", "zmena"], "c": [0], "w": "vzájomný súhlas o ukončení"}, {"q": "Novácia je:", "o": ["nahradenie záväzku novým", "zrušenie", "zmena", "doplnenie"], "c": [0], "w": "nahradenie záväzku novým"}, {"q": "Privátna novácia je:", "o": ["zmena obsahu záväzku", "zmena subjektu", "zrušenie", "vznik"], "c": [0], "w": "zmena obsahu záväzku"}, {"q": "Kumulatívna novácia je:", "o": ["pristúpenie nového dlžníka", "zmena obsahu", "zrušenie", "vznik"], "c": [0], "w": "pristúpenie nového dlžníka"}, {"q": "Cesia je:", "o": ["postúpenie pohľadávky", "prevzatie dlhu", "zrušenie", "vznik"], "c": [0], "w": "postúpenie pohľadávky"}, {"q": "Intercesia je:", "o": ["prevzatie dlhu", "postúpenie pohľadávky", "zrušenie", "vznik"], "c": [0], "w": "prevzatie dlhu"}, {"q": "Kompenzácia je:", "o": ["započítanie pohľadávok", "zaplatenie", "odpustenie", "zrušenie"], "c": [0], "w": "započítanie pohľadávok"}, {"q": "Promlčanie je:", "o": ["oslabenie práva uplynutím času", "zánik práva", "vznik práva", "prevod práva"], "c": [0], "w": "oslabenie práva uplynutím času"}, {"q": "Restitúcia je:", "o": ["vrátenie plnenia", "náhrada škody", "úrok", "pokuta"], "c": [0], "w": "vrátenie plnenia"}, {"q": "Kondikcia je:", "o": ["nárok na vydanie bezdôvodného obohatenia", "náhrada škody", "úrok", "pokuta"], "c": [0], "w": "nárok na vydanie bezdôvodného obohatenia"}];


function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepare(qs){
  return qs.map(q=>{
    const paired = q.o.map((opt,i)=>({opt, isC:q.c.includes(i)}));
    shuffle(paired);
    return { q:q.q, o:paired.map(p=>p.opt), c:paired.map((p,i)=>p.isC?i:null).filter(x=>x!==null), w:q.w };
  });
}

let mode='learn', questions=[], current=0, answers=[], timerId=null, timeLeft=600, currentSubject='spravne', testTitle='';
function $(id){ return document.getElementById(id); }
function setMode(m){ mode=m; $('mExam').classList.toggle('btn-p', m==='exam'); $('mLearn').classList.toggle('btn-p', m==='learn'); }
$('mExam').onclick = () => setMode('exam');
$('mLearn').onclick = () => setMode('learn');

function buildModes(){
  const c = $('modes'); c.innerHTML = '';
  const isObc = currentSubject === 'obcianske';
  const data = isObc ? OBC_QUESTIONS : SCHOOL_QUESTIONS;
  const label = isObc ? 'Občianske právo – Testy' : 'Školské testy';
  const div = document.createElement('div');
  div.innerHTML = `<div class="label">${label} (${data.length} otázok)</div><div class="grid"></div>`;
  const g = div.querySelector('.grid');
  const tests = [];
  const sh = shuffle([...data]);
  for (let i = 0; i < sh.length; i += 10) tests.push(prepare(sh.slice(i, i+10)));
  tests.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'mode';
    b.innerHTML = `<b>Test ${i+1}</b><span>${t.length} otázok · 10 min</span>`;
    b.onclick = () => begin(t, `${label} ${i+1}`);
    g.appendChild(b);
  });
  const rb = document.createElement('button');
  rb.className = 'mode';
  rb.innerHTML = `<b>Náhodný test</b><span>10 otázok</span>`;
  rb.onclick = () => begin(prepare(shuffle([...data]).slice(0,10)), 'Náhodný test');
  g.appendChild(rb);
  c.appendChild(div);

  // AI tests for Občianske právo
  if (isObc && typeof AI_OBC_QUESTIONS !== 'undefined' && AI_OBC_QUESTIONS.length) {
    const aiDiv = document.createElement('div');
    aiDiv.innerHTML = `<div class="label" style="margin-top:18px">AI Testy zo skrípt (${AI_OBC_QUESTIONS.length} otázok)</div><div class="grid"></div>`;
    const ag = aiDiv.querySelector('.grid');
    const aiTests = [];
    const ash = shuffle([...AI_OBC_QUESTIONS]);
    for (let i = 0; i < ash.length; i += 10) aiTests.push(prepare(ash.slice(i, i+10)));
    aiTests.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'mode';
      b.innerHTML = `<b>AI Test ${i+1}</b><span>${t.length} otázok · 10 min</span>`;
      b.onclick = () => begin(t, `AI Test ${i+1}`);
      ag.appendChild(b);
    });
    const arb = document.createElement('button');
    arb.className = 'mode';
    arb.innerHTML = `<b>Náhodný AI test</b><span>10 otázok</span>`;
    arb.onclick = () => begin(prepare(shuffle([...AI_OBC_QUESTIONS]).slice(0,10)), 'Náhodný AI test');
    ag.appendChild(arb);
    c.appendChild(aiDiv);
  }

  // AI tests for Správne právo
  if (!isObc && typeof AI_QUESTIONS !== 'undefined' && AI_QUESTIONS.length) {
    const aiDiv = document.createElement('div');
    aiDiv.innerHTML = `<div class="label" style="margin-top:18px">AI Testy zo skrípt (${AI_QUESTIONS.length} otázok)</div><div class="grid"></div>`;
    const ag = aiDiv.querySelector('.grid');
    const aiTests = [];
    const ash = shuffle([...AI_QUESTIONS]);
    for (let i = 0; i < ash.length; i += 10) aiTests.push(prepare(ash.slice(i, i+10)));
    aiTests.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'mode';
      b.innerHTML = `<b>AI Test ${i+1}</b><span>${t.length} otázok · 10 min</span>`;
      b.onclick = () => begin(t, `AI Test ${i+1}`);
      ag.appendChild(b);
    });
    const arb = document.createElement('button');
    arb.className = 'mode';
    arb.innerHTML = `<b>Náhodný AI test</b><span>10 otázok</span>`;
    arb.onclick = () => begin(prepare(shuffle([...AI_QUESTIONS]).slice(0,10)), 'Náhodný AI test');
    ag.appendChild(arb);
    c.appendChild(aiDiv);
  }
}

function begin(qs, title){
  questions = qs.map(q => ({ ...q, selected: new Set() }));
  current = 0; answers = []; timeLeft = 600; testTitle = title;
  $('start').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  $('result').classList.add('hidden');
  $('rtitle').textContent = title;
  $('testNum').textContent = title;
  show();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}

function tick(){
  timeLeft--;
  const m = Math.floor(timeLeft/60), s = timeLeft % 60;
  $('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  $('timer').classList.toggle('low', timeLeft < 60);
  if (timeLeft <= 0) finish();
}

function show(){
  const q = questions[current];
  $('pos').textContent = `Otázka ${current+1} z ${questions.length}`;
  $('prog').style.width = `${(current / questions.length) * 100}%`;
  $('qtext').textContent = q.q;
  $('opts').innerHTML = ''; $('fb').innerHTML = ''; $('fb').className = '';
  $('next').disabled = true; $('next').textContent = 'Potvrdiť';
  q.o.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="box">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
    b.onclick = () => toggle(i, b);
    $('opts').appendChild(b);
  });
}

function toggle(i, btn){
  const q = questions[current];
  if (q.answered && mode === 'learn') return;
  if (q.selected.has(i)) q.selected.delete(i); else q.selected.add(i);
  btn.classList.toggle('sel');
  $('next').disabled = q.selected.size === 0;
}

function isRight(q){
  const sel = [...q.selected].sort(), corr = [...q.c].sort();
  return sel.length === corr.length && sel.every((v,i) => v === corr[i]);
}

function paint(q){
  const opts = $('opts').children;
  q.o.forEach((_, i) => {
    const b = opts[i];
    b.classList.remove('sel');
    const isC = q.c.includes(i), isS = q.selected.has(i);
    if (isC && isS) b.classList.add('ok');
    else if (isC && !isS) b.classList.add('miss');
    else if (!isC && isS) b.classList.add('bad');
  });
  const ok = isRight(q);
  $('fb').className = 'fb ' + (ok ? 'ok' : 'bad');
  $('fb').textContent = (ok ? 'Správne. ' : 'Nesprávne. ') + (q.w || '');
  $('next').disabled = false; $('next').textContent = 'Ďalšia';
}

function next(){
  const q = questions[current];
  if (!q.answered){
    q.answered = true; q.correct = isRight(q); answers.push(q);
    if (mode === 'learn') { paint(q); return; }
  }
  if (current < questions.length - 1) { current++; show(); } else finish();
}
$('next').onclick = next;

function finish(){
  if (timerId) clearInterval(timerId);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  const correct = answers.filter(a => a.correct).length, total = questions.length;
  const pass = correct >= Math.ceil(total * 0.6);
  $('rscore').textContent = `${correct} / ${total}`;
  $('rverdict').innerHTML = pass ? '<span class="pass">Úspešne</span>' : '<span class="fail">Neúspešne</span>';
  const rev = $('review');
  rev.innerHTML = '<div class="label" style="margin-top:12px">Prehľad</div>';
  answers.forEach((a, i) => {
    const d = document.createElement('div'); d.className = 'rev';
    d.innerHTML = `<p><b>${i+1}. ${a.q}</b></p><p style="color:var(--muted);font-size:14px">${a.correct ? '✓' : '✗'} ${a.w || ''}</p>`;
    rev.appendChild(d);
  });
}

$('quit').onclick = () => {
  if (timerId) clearInterval(timerId);
  $('quiz').classList.add('hidden');
  $('start').classList.remove('hidden');
  buildModes();
};

$('again').onclick = () => {
  $('result').classList.add('hidden');
  $('start').classList.remove('hidden');
  buildModes();
};

$('retry').onclick = () => {
  const wrong = answers.filter(a => !a.correct).map(a => ({ q:a.q, o:a.o, c:a.c, w:a.w }));
  if (!wrong.length) return alert('Žiadne chybné.');
  begin(prepare(wrong), 'Opakovanie chybných');
};

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = e.key.toUpperCase();
  if (k >= 'A' && k <= 'F') {
    const i = k.charCodeAt(0) - 65;
    const b = $('opts').children[i];
    if (b) b.click();
  } else if (e.key === 'Enter' && !$('next').disabled) next();
});

$('backToSubject').onclick = () => {
  $('start').classList.add('hidden');
  $('subject').classList.remove('hidden');
};
$('subjSpravne').onclick = () => {
  currentSubject = 'spravne';
  $('subject').classList.add('hidden');
  $('start').classList.remove('hidden');
  buildModes();
};
$('subjObcianske').onclick = () => {
  currentSubject = 'obcianske';
  $('subject').classList.add('hidden');
  $('start').classList.remove('hidden');
  buildModes();
};
</script>
